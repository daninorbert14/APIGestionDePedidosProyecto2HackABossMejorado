# Solo estáticos: no hay proxy hacia la API, el navegador habla con el
# backend usando la URL que Vite incrustó al construir (VITE_API_URL).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # React Router: lo que no es un archivo devuelve index.html (RF-6).
  # Sin esto, recargar /terminal daría 404 del servidor.
  location / {
    try_files $uri /index.html;
  }
}