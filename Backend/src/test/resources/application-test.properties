# Perfil de test: sustituye la base de datos real por una en memoria (H2),
# para que los tests no dependan de tener MySQL arrancado ni de las
# variables de entorno DB_URL/DB_USERNAME/DB_PASSWORD.
# Se activa con @ActiveProfiles("test") en las clases de test que lo necesiten
# (@SpringBootTest con contexto completo, y los tests de integración con TestRestTemplate).

# Base de datos en memoria: se crea al arrancar el contexto y desaparece al cerrarlo.
# DB_CLOSE_DELAY=-1 evita que H2 borre la base de datos en cuanto la primera
# conexión se cierra, lo cual pasaría con varias conexiones abriéndose y
# cerrándose a la vez durante un mismo test.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

# Con create-drop, Hibernate genera el esquema (tablas, claves, restricciones)
# a partir de las entidades @Entity al arrancar, y lo destruye al terminar.
# No usamos "update" aquí porque cada ejecución de test debe partir de una
# base de datos limpia, no de un esquema que fue quedando de ejecuciones anteriores.
spring.jpa.hibernate.ddl-auto=create-drop