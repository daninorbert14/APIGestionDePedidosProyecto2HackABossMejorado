# Perfil de test: usa PostgreSQL mediante Testcontainers.
# Se activa con @ActiveProfiles("test") en las clases de test que lo necesiten.
# El contenedor PostgreSQL se declara en PostgresTestcontainersConfig.java, con la imagen
# postgres:17-alpine: debe ser la misma etiqueta que la del servicio db de docker-compose.yml.
# Cada clase de test lo importa con @Import(PostgresTestcontainersConfig.class).
# Spring Boot arranca y para el contenedor, y @ServiceConnection configura la
# URL, el usuario y la contraseña: por eso no se fijan aquí.

# sin replace=none, @DataJpaTest sustituiría el DataSource por H2 en memoria
spring.test.database.replace=none

# El esquema lo crea Hibernate en los tests; las migraciones Flyway no intervienen
# (la V2 siembra el catálogo y chocaría con los datos que crean los propios tests).
spring.jpa.hibernate.ddl-auto=create
spring.flyway.enabled=false

# Excepción: MigracionFlywayTest reactiva flyway=true y ddl-auto=validate con
# @SpringBootTest(properties=...) para probar las migraciones contra un contenedor vacío.