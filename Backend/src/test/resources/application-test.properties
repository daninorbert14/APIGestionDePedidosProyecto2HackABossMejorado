# Perfil de test: usa PostgreSQL mediante Testcontainers.
# Se activa con @ActiveProfiles("test") en las clases de test que lo necesiten
# (@SpringBootTest con contexto completo, y los tests de integración con TestRestTemplate).
# El contenedor PostgreSQL se configura en PostgresTestcontainersConfig.java
# y comparte la misma instancia entre todos los tests del perfil "test".

# Configuración de Testcontainers: spring.test.database.replace=none evita que
# @DataJpaTest reemplace el DataSource por defecto por H2, para que use el
# DataSource provisto por el contenedor PostgreSQL estático.
spring.test.database.replace=none

# URL del contenedor PostgreSQL (establecida por @ServiceConnection al arrancar).
spring.datasource.url=jdbc:postgresql://localhost:5432/test

# Usuario y password del container PostgreSQL (coinciden con POSTGRES_USER/POSTGRES_PASSWORD del docker run)
spring.datasource.username=test
spring.datasource.password=test

# El driver se sobreescribe automáticamente por Testcontainers, pero dejamos
# la clase por si alguien la lee explícitamente.
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate necesita la dialect explícita cuando la URL no proporciona suficiente metadata
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate auto-crea el esquema en tests (create)
spring.jpa.hibernate.ddl-auto=create
