spring.application.name=Gestion_de_pedidos_API

# Datos de conexión a PostgreSQL (las variables las define el IDE o Docker Compose)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración de JPA/Hibernate
# validate: el esquema lo crean las migraciones Flyway; Hibernate solo lo comprueba
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Habilitar api-docs y swagger-ui
springdoc.api-docs.enable=true
springdoc.swagger-ui.enable=true

# Url o ruta de swagger-ui
springdoc.swagger-ui.path=/doc/swagger-ui.html

# Origen permitido para CORS (el frontend en desarrollo). En producción,
# sobrescribir con la variable de entorno FRONTEND_URL apuntando al dominio real.
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}